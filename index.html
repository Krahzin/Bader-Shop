<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drone Zone — Shop</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('shop.theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    }catch(e){}
  })();
</script>

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:title" content="Drone Zone">
<meta property="og:description" content="Browse our stock and order in seconds.">
<meta property="og:image" content="https://dronezonelb.com/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://dronezonelb.com/">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Drone Zone">
<meta name="twitter:description" content="Browse our stock and order in seconds.">
<meta name="twitter:image" content="https://dronezonelb.com/og-image.jpg">

<meta name="theme-color" content="#128c7e">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#" onclick="return false">
      <span class="brand-mark" id="brandMark">
        <img src="logo.png" alt="Drone Zone logo">
      </span>
      <span class="brand-name" id="brandName">Drone Zone</span>
    </a>
    <div class="search">
      <input id="searchInput" type="search" placeholder="Search products…" autocomplete="off">
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
    <button class="cart-btn" id="cartBtn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <span>Cart</span>
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<!-- ================= SITE NOTICE ================= -->
<div class="site-notice" role="note">
  <div class="wrap">
    <strong>Please note:</strong> Drone accessories require a  small <strong>Whish deposit</strong> before we finalize the order.
  </div>
</div>

<section class="wrap hero">
  <h1 id="heroTitle">Drone Zone</h1>
  <p id="heroTagline">Browse our stock and order in seconds.</p>
</section>

<div class="wrap">
  <div class="filters" id="filters"></div>
</div>

<main class="wrap">
  <div class="grid" id="grid"></div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p id="footerNote" class="footer-note" style="margin:0"></p>
    <p class="footer-contact" id="footerContact"></p>
  </div>
</footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Shopping cart">
  <div class="drawer-head">
    <h2>Your cart</h2>
    <button class="icon-btn" id="closeCart" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body" id="cartItems"></div>
  <div class="drawer-foot">
    <div class="totals">
      <span>Total</span>
      <strong id="cartTotal">$0.00</strong>
    </div>
    <div class="field">
      <input id="custName" type="text" placeholder="Your name (optional)">
    </div>
    <div class="field">
      <textarea id="custNote" rows="2" placeholder="Note — address, delivery, questions… (optional)"></textarea>
    </div>
    <button class="btn-wa" id="orderBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
      </svg>
      Order on WhatsApp
    </button>
    <p class="hint" id="drawerHint">No payment here — we confirm everything on WhatsApp.</p>
  </div>
</aside>

<div class="lightbox" id="lightbox" role="dialog" aria-label="Image viewer">
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close">✕</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous image">‹</button>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next image">›</button>
  <div class="lb-stage" id="lbStage"></div>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
