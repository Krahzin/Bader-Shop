media:
  input: images/uploads
  output: /images/uploads

content:
  - name: store
    label: Store
    type: file
    path: products.json
    fields:
      - name: settings
        label: Store settings
        type: object
        fields:
          - name: storeName
            label: Store name
            type: string
            required: true
          - name: tagline
            label: Tagline
            type: string
          - name: whatsapp
            label: WhatsApp number
            type: string
            required: true
            description: Country code + digits only, no spaces or plus (e.g. 96176199961)
          - name: currency
            label: Currency symbol
            type: string
          - name: footerNote
            label: Footer note
            type: string
          - name: categoryOrder
            label: Category order
            type: string
            list: true
            required: false
            description: Categories in the order you want them to appear. Unlisted categories fall in alphabetical order after these.

      - name: products
        label: Products
        type: object
        list: true
        fields:
          - name: id
            label: ID
            type: string
            required: true
          - name: name
            label: Name
            type: string
            required: true
          - name: price
            label: Price
            type: number
            required: true
          - name: category
            label: Category
            type: string
          - name: stock
            label: Stock
            type: number
            description: Leave empty for unlimited
          - name: desc
            label: Description
            type: text
          - name: image
            label: Primary image (cover)
            type: image
          - name: images
            label: Additional images
            type: image
            required: false
            options:
              multiple: true
              unique: true
          - name: colors
            label: Colours (optional)
            type: string
            list: true
            required: false
            description: One per line. Add a hex code after a space for an exact swatch (e.g. "Ocean Blue #3a6fb0").

  - name: blog
    label: Blog
    type: file
    path: blog.json
    fields:
      - name: posts
        label: Posts
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: date
            label: Date
            type: date
          - name: cover
            label: Cover image
            type: image
            required: false
          - name: summary
            label: Short summary
            type: text
            description: One or two sentences shown on the blog page.
          - name: body
            label: Post
            type: rich-text
          - name: published
            label: Published
            type: boolean
            default: true
            description: Untick to hide the post without deleting it.

  - name: faq
    label: FAQ
    type: file
    path: faq.json
    fields:
      - name: questions
        label: Questions
        type: object
        list: true
        fields:
          - name: topic
            label: Topic
            type: string
            description: Questions with the same topic are grouped together (e.g. Ordering, Products, Delivery).
          - name: question
            label: Question
            type: string
            required: true
          - name: answer
            label: Answer
            type: text
            required: true

  - name: tmpcode0
    label: tmp index.html
    type: file
    path: index.html
    format: raw

  - name: tmpcode1
    label: tmp blog.html
    type: file
    path: blog.html
    format: raw

  - name: tmpcode2
    label: tmp faq.html
    type: file
    path: faq.html
    format: raw

  - name: tmpcode3
    label: tmp pages.js
    type: file
    path: pages.js
    format: raw

  - name: tmpcode4
    label: tmp app.js
    type: file
    path: app.js
    format: raw
