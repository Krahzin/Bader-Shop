media:
  input: images/uploads
  output: /images/uploads

content:
  - name: store
    label: Store
    type: file
    path: products.json
    fields:
      - name: settings
        label: Store settings
        type: object
        fields:
          - name: storeName
            label: Store name
            type: string
            required: true
          - name: tagline
            label: Tagline
            type: string
          - name: whatsapp
            label: WhatsApp number
            type: string
            required: true
            description: Country code + digits only, no spaces or plus (e.g. 96176199961)
          - name: currency
            label: Currency symbol
            type: string
          - name: footerNote
            label: Footer note
            type: string
          - name: categoryOrder
            label: Category order
            type: string
            list: true
            required: false
            description: Categories in the order you want them to appear. Unlisted categories fall in alphabetical order after these.

      - name: products
        label: Products
        type: object
        list: true
        fields:
          - name: id
            label: ID
            type: string
            required: true
          - name: name
            label: Name
            type: string
            required: true
          - name: price
            label: Price
            type: number
            required: true
          - name: category
            label: Category
            type: string
          - name: stock
            label: Stock
            type: number
            description: Leave empty for unlimited
          - name: desc
            label: Description
            type: text
          - name: image
            label: Primary image (cover)
            type: image
          - name: images
            label: Additional images
            type: image
            required: false
            options:
              multiple: true
              unique: true
          - name: colors
            label: Colours (optional)
            type: string
            list: true
            required: false
            description: One per line. Add a hex code after a space for an exact swatch (e.g. "Ocean Blue #3a6fb0").
